<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Server-Pulse</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="app">
    <header class="topbar">
      <div class="host-wrap">
        <span id="statusDot" class="dot dot-idle" aria-hidden="true"></span>
        <div class="host-meta">
          <span id="hostName" class="hostname">Server-Pulse</span>
          <span id="hostSub" class="host-sub">not configured</span>
        </div>
      </div>
      <div class="actions">
        <button id="refreshBtn" class="icon-btn" type="button" title="Refresh" aria-label="Refresh">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 12a9 9 0 1 1-2.64-6.36L21 8"></path>
            <path d="M21 3v5h-5"></path>
          </svg>
        </button>
        <button id="settingsBtn" class="icon-btn" type="button" title="Settings" aria-label="Settings">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="3"></circle>
            <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09a1.65 1.65 0 0 0-1-1.51 1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09a1.65 1.65 0 0 0 1.51-1 1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33h.08a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51h.08a1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82v.08a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
          </svg>
        </button>
      </div>
    </header>

    <div id="errorBanner" class="banner hidden" role="alert"></div>

    <main id="dashboardView" class="view">
      <section class="summary" aria-label="System summary">
        <div class="pill">
          <div class="pill-head">
            <span class="pill-label">CPU</span>
            <span id="cpuSub" class="pill-sub num">--</span>
          </div>
          <div id="cpuVal" class="pill-val num">--%</div>
          <div class="bar"><div id="cpuBar" class="bar-fill"></div></div>
        </div>
        <div class="pill">
          <div class="pill-head">
            <span class="pill-label">RAM</span>
            <span id="ramSub" class="pill-sub num">--</span>
          </div>
          <div id="ramVal" class="pill-val num">--%</div>
          <div class="bar"><div id="ramBar" class="bar-fill"></div></div>
        </div>
        <div class="pill">
          <div class="pill-head">
            <span class="pill-label">DISK</span>
            <span id="diskSub" class="pill-sub num">--</span>
          </div>
          <div id="diskVal" class="pill-val num">--%</div>
          <div class="bar"><div id="diskBar" class="bar-fill"></div></div>
        </div>
      </section>

      <section class="section">
        <div class="section-head">
          <span class="section-title">CONTAINERS</span>
          <span id="containerCount" class="section-count num">0</span>
        </div>
        <div id="containerList" class="list"></div>
      </section>

      <section class="section">
        <button id="procToggle" class="section-head section-btn" type="button" aria-expanded="false">
          <span class="section-title">TOP PROCESSES</span>
          <span class="section-right">
            <span id="procCount" class="section-count num">0</span>
            <span id="procChevron" class="chevron" aria-hidden="true">▸</span>
          </span>
        </button>
        <div id="procList" class="list hidden"></div>
      </section>
    </main>

    <section id="settingsView" class="view settings hidden" aria-label="Settings">
      <form id="settingsForm" class="form" novalidate>
        <label class="field">
          <span class="field-label">Server URL (or Quick-Connect Link)</span>
          <input id="inputUrl" class="input" type="text" placeholder="pulse://host:9191#token  or  http://host:9191" autocomplete="off" spellcheck="false" required>
        </label>
        <label class="field">
          <span class="field-label">Bearer Token</span>
          <div class="token-row">
            <input id="inputToken" class="input" type="password" placeholder="64-char hex token" autocomplete="off" spellcheck="false" required>
            <button id="toggleTokenBtn" class="ghost-btn" type="button">Show</button>
          </div>
        </label>
        <div class="field">
          <span class="field-label">Toolbar Badge Metric</span>
          <div class="seg" role="radiogroup" aria-label="Badge metric">
            <label class="seg-opt">
              <input type="radio" name="badgeMetric" value="ram" checked>
              <span>RAM %</span>
            </label>
            <label class="seg-opt">
              <input type="radio" name="badgeMetric" value="cpu">
              <span>CPU %</span>
            </label>
          </div>
        </div>
        <div id="settingsStatus" class="settings-status"></div>
        <div class="form-actions">
          <button id="cancelBtn" class="btn btn-secondary" type="button">Cancel</button>
          <button id="saveBtn" class="btn btn-primary" type="submit">Save &amp; Connect</button>
        </div>
      </form>
    </section>
  </div>
  <script type="module" src="popup.js"></script>
</body>
</html>
